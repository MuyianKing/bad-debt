<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bgB" cx="0.5" cy="0.42" r="0.82"><stop offset="0" stop-color="#bb1722"/><stop offset="0.5" stop-color="#7c0a14"/><stop offset="1" stop-color="#33030a"/></radialGradient>
  <radialGradient id="spotB" cx="0.5" cy="0.46" r="0.44"><stop offset="0" stop-color="#ffa25c" stop-opacity="0.22"/><stop offset="1" stop-color="#ffa25c" stop-opacity="0"/></radialGradient>
  
  <linearGradient id="gold" x1="0.12" y1="0.02" x2="0.86" y2="0.98"><stop offset="0" stop-color="#ffeeb4"/><stop offset="0.28" stop-color="#ffd75c"/><stop offset="0.6" stop-color="#f5b31c"/><stop offset="1" stop-color="#d08605"/></linearGradient>
