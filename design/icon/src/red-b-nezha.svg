  <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0.7"><stop offset="0" stop-color="#ff9c7c"/><stop offset="0.35" stop-color="#f2493a"/><stop offset="1" stop-color="#b4161f"/></linearGradient>
  <radialGradient id="robeLight" cx="0.38" cy="0.16" r="0.66"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
