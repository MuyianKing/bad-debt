  <linearGradient id="skin" x1="0.2" y1="0.05" x2="0.8" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="0.5" stop-color="#fff2d8"/><stop offset="1" stop-color="#f7d095"/></linearGradient>
  <radialGradient id="faceShade" cx="0.5" cy="0.34" r="0.74"><stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/><stop offset="0.7" stop-color="#e8a35a" stop-opacity="0.07"/><stop offset="1" stop-color="#c9791f" stop-opacity="0.22"/></radialGradient>
  <linearGradient id="hair" x1="0.25" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#3a0a12"/><stop offset="1" stop-color="#160207"/></linearGradient>
